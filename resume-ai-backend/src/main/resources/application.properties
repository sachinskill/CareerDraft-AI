spring.application.name=resume-ai-backend
server.port=${SERVER_PORT:8081}

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Disable lazy-load during view rendering (removes startup warning)
spring.jpa.open-in-view=false

# Disable Spring Security auto-generated password (we use JWT)
spring.security.user.name=disabled
spring.security.user.password=disabled

# AI Configuration
# For local dev the key is set directly here so it always works regardless of env loading.
# For production: replace with your actual key or use a real environment variable.
ai.mode=${AI_MODE:groq}
groq.api.key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Python ATS Microservice
ats.python.service.url=${ATS_PYTHON_URL:http://localhost:8000}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# Cookie Configuration
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.domain=${COOKIE_DOMAIN:localhost}

# CORS — comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:sec_def_123}

# Logging
logging.level.com.resume.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

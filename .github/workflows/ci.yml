name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      working-directory: ./resume-ai-backend
      run: ./mvnw clean compile # Keeping basic check to compile, testing could require Postgres

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './resume_frontend/package-lock.json'
    - name: Build React App
      working-directory: ./resume_frontend
      run: |
        npm ci
        npm run build

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-frontend]
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker Images
      # Only build local, don't start it entirely since dependencies might crash in ephemeral runners without full keys
      run: docker-compose build
